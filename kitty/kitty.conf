# ============================================================
# KITTY — FOGGY SAGE GLASS
# White wallpaper / black text
# ============================================================

# ------------------------------------------------------------
# FONT
# ------------------------------------------------------------

font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font
italic_font JetBrainsMono Nerd Font
bold_italic_font JetBrainsMono Nerd Font

font_size 12.0

# ------------------------------------------------------------
# WINDOW
# ------------------------------------------------------------

# Let Hyprland handle decorations
hide_window_decorations yes

# Minimal internal breathing room
window_padding_width 8

# Don't let Kitty add its own visual frame
window_border_width 0

# Transparent background
background_opacity 0.65

# ------------------------------------------------------------
# CURSOR
# ------------------------------------------------------------

cursor_shape beam
cursor_beam_thickness 1.5

cursor_blink_interval 0.85

# Black cursor against the foggy green glass
cursor #111812

# ------------------------------------------------------------
# TEXT
# ------------------------------------------------------------

foreground #101710
background #b8d0be

selection_foreground #ffffff
selection_background #6f9079

# ------------------------------------------------------------
# ANSI COLORS
# ------------------------------------------------------------

# Black
color0  #182019
color8  #53635a

# Red
color1  #a94f48
color9  #c76b62

# Green
color2  #52745d
color10 #70997b

# Yellow
color3  #817d50
color11 #9b9764

# Blue
color4  #526f78
color12 #6f919a

# Magenta
color5  #756276
color13 #967d99

# Cyan
color6  #557b78
color14 #709b96

# White
color7  #dce6df
color15 #f4f7f4

# ------------------------------------------------------------
# TERMINAL BEHAVIOR
# ------------------------------------------------------------

enable_audio_bell no

visual_bell_duration 0.0

scrollback_lines 10000

# ------------------------------------------------------------
# URL / TEXT SELECTION
# ------------------------------------------------------------

url_color #385842
url_style curly

# ------------------------------------------------------------
# PERFORMANCE
# ------------------------------------------------------------

repaint_delay 10
input_delay 0
